version: "3"

tasks:
  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  tidy:
    desc: Tidy go.mod and go.sum
    cmds:
      - go mod tidy

  lint:
    desc: Run static analysis (vet plus tidy check)
    cmds:
      - task: vet
      - go mod tidy -diff

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf bin
